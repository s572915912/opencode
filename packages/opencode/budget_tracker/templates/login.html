{% extends "base.html" %} {% block title %}Login - Budget Tracker{% endblock %} {% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card">
      <div class="card-header">
        <h4 class="mb-0">Login to Your Account</h4>
      </div>
      <div class="card-body">
        <form id="loginForm">
          <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input type="text" class="form-control" id="username" name="username" required />
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" name="password" required />
          </div>

          <div class="d-grid gap-2">
            <button type="submit" class="btn btn-primary">Login</button>
            <a href="/register" class="btn btn-outline-secondary">Need an account? Register</a>
          </div>
        </form>

        <div id="message" class="mt-3"></div>
      </div>
    </div>
  </div>
</div>

<script>
  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault()

    const username = document.getElementById("username").value
    const password = document.getElementById("password").value

    const response = await fetch("/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password }),
    })

    const data = await response.json()

    if (response.ok) {
      showMessage("Login successful! Redirecting...", "success")
      setTimeout(() => (window.location.href = "/dashboard"), 1000)
    } else {
      showMessage(data.error || "Login failed", "danger")
    }
  })

  function showMessage(text, type) {
    const div = document.getElementById("message")
    div.innerHTML = `<div class="alert alert-${type}">${text}</div>`
  }
</script>
{% endblock %}
